<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Física Avanzada - Termodinámica, Electromagnetismo y Óptica</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- KaTeX for Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const TOPICS = [
            {
                id: 'termodinamica',
                name: 'Termodinámica',
                category: 'Termodinámica',
                description: 'Estudio del calor, el trabajo, la energía y las leyes que los rigen.',
                formulas: [
                    { name: 'Primera Ley (Conservación)', eq: '$$\\Delta U = Q - W$$' },
                    { name: 'Eficiencia Térmica (Carnot)', eq: '$$\\eta = 1 - \\frac{T_c}{T_h}$$' },
                    { name: 'Calor Sensible', eq: '$$Q = m c \\Delta T$$' }
                ]
            },
            {
                id: 'electromagnetismo',
                name: 'Electromagnetismo',
                category: 'Electromagnetismo',
                description: 'Interacción entre campos eléctricos y magnéticos, Ley de Coulomb, Ampère y Faraday.',
                formulas: [
                    { name: 'Ley de Coulomb', eq: '$$F = k_e \\frac{|q_1 q_2|}{r^2}$$' },
                    { name: 'Ley de Ohm', eq: '$$V = I R$$' },
                    { name: 'Fuerza Magnética', eq: '$$\\vec{F} = q(\\vec{v} \\times \\vec{B})$$' }
                ]
            },
            {
                id: 'optica',
                name: 'Luz y Óptica',
                category: 'Óptica',
                description: 'Estudio de la propagación de la luz, reflexión, refracción, lentes y espejos.',
                formulas: [
                    { name: 'Ley de Snell', eq: '$$n_1 \\sin(\\theta_1) = n_2 \\sin(\\theta_2)$$' },
                    { name: 'Ecuación de Lentes y Espejos', eq: '$$\\frac{1}{f} = \\frac{1}{d_o} + \\frac{1}{d_i}$$' },
                    { name: 'Índice de Refracción', eq: '$$n = \\frac{c}{v}$$' }
                ]
            }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('simuladores');
            const [selectedTopic, setSelectedTopic] = useState('termodinamica');
            
            const [chats, setChats] = useState(() => {
                const saved = localStorage.getItem('fisica_master_chats');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) { }
                }
                return [{ id: 'chat_1', title: 'Nueva Sesión de Física', messages: [
                    { role: 'assistant', content: '¡Hola! Soy tu tutor experto **exclusivamente en Física** (Termodinámica, Electromagnetismo y Óptica). ¿Qué duda tienes hoy o qué imagen de ejercicio deseas analizar?' }
                ]}];
            });
            const [currentChatId, setCurrentChatId] = useState(() => chats[0]?.id || 'chat_1');
            
            const [inputMessage, setInputMessage] = useState('');
            const [selectedImage, setSelectedImage] = useState(null);
            const [loadingAI, setLoadingAI] = useState(false);
            const fileInputRef = useRef(null);
            const chatEndRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('fisica_master_chats', JSON.stringify(chats));
            }, [chats]);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [chats, currentChatId]);

            const currentChat = chats.find(c => c.id === currentChatId) || chats[0];

            const handleImageSelect = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setSelectedImage(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const removeSelectedImage = () => {
                setSelectedImage(null);
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            const handleSendMessage = async (e) => {
                e.preventDefault();
                if (!inputMessage.trim() && !selectedImage) return;

                const userMsg = {
                    role: 'user',
                    content: inputMessage,
                    image: selectedImage
                };

                const updatedChats = chats.map(chat => {
                    if (chat.id === currentChatId) {
                        const newMsgs = [...chat.messages, userMsg];
                        let title = chat.title;
                        if (chat.messages.length <= 1 && inputMessage.trim()) {
                            title = inputMessage.slice(0, 30) + (inputMessage.length > 30 ? '...' : '');
                        }
                        return { ...chat, title, messages: newMsgs };
                    }
                    return chat;
                });

                setChats(updatedChats);
                setInputMessage('');
                setSelectedImage(null);
                if (fileInputRef.current) fileInputRef.current.value = '';
                setLoadingAI(true);

                try {
                    // 👉 PEGA TU API KEY DE GOOGLE AQUÍ ENTRE LAS COMILLAS 👈
                    const apiKey = "PEGA_AQUÍ_TU_API_KEY"; 

                    const messagesToSend = currentChat.messages.concat([userMsg]).map(m => ({
                        role: m.role === 'user' ? 'user' : 'model',
                        parts: [
                            ...(m.content ? [{ text: m.content }] : []),
                            ...(m.image ? [{ inline_data: { mime_type: m.image.substring(5, m.image.indexOf(';')), data: m.image.split(',')[1] } }] : [])
                        ]
                    }));

                    const systemInstruction = "Eres un tutor experto y estricto especializado EXCLUSIVAMENTE en Física (Termodinámica, Electromagnetismo, Óptica, etc.). TU ÚNICA ÁREA DE CONOCIMIENTO ES LA FÍSICA. Si el usuario te pregunta sobre cualquier otro tema que no sea física (como matemáticas sin contexto físico, programación, historia, cultura general, etc.), debes rechazar la consulta de forma educada recordándole que solo estás programado para responder sobre temas de física. Cuando te envíen problemas o imágenes de física, resuélvelos paso a paso con rigor científico.";

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            system_instruction: { parts: [{ text: systemInstruction }] },
                            contents: messagesToSend
                        })
                    });

                    const data = await response.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Lo siento, ha ocurrido un error al conectar con el asistente.";

                    const aiMsg = { role: 'assistant', content: aiText };

                    setChats(prev => prev.map(c => c.id === currentChatId ? { ...c, messages: [...c.messages, aiMsg] } : c));
                } catch (err) {
                    console.error(err);
                    const errorMsg = { role: 'assistant', content: 'Error de red o conexión con la API de IA.' };
                    setChats(prev => prev.map(c => c.id === currentChatId ? { ...c, messages: [...c.messages, errorMsg] } : c));
                } finally {
                    setLoadingAI(false);
                }
            };

            const createNewChat = () => {
                const newId = 'chat_' + Date.now();
                const newChatObj = {
                    id: newId,
                    title: 'Nueva Sesión de Física',
                    messages: [{ role: 'assistant', content: '¡Hola! Soy tu tutor experto **exclusivamente en Física**. ¿Qué duda o ejercicio analizamos hoy?' }]
                };
                setChats([newChatObj, ...chats]);
                setCurrentChatId(newId);
            };

            const deleteChat = (id, e) => {
                e.stopPropagation();
                if (chats.length <= 1) return;
                const filtered = chats.filter(c => c.id !== id);
                setChats(filtered);
                if (currentChatId === id) {
                    setCurrentChatId(filtered[0].id);
                }
            };

            return (
                <div className="flex h-screen overflow-hidden bg-slate-950 text-slate-100">
                    <aside className="w-80 bg-slate-900 border-r border-slate-800 flex flex-col">
                        <div className="p-4 border-b border-slate-800 flex items-center justify-between">
                            <h1 className="font-bold text-lg text-cyan-400 flex items-center gap-2">
                                <span className="p-1 bg-cyan-500/10 rounded-lg">⚛️</span> Física Master IA
                            </h1>
                        </div>

                        <div className="p-3 border-b border-slate-800">
                            <button onClick={createNewChat} className="w-full py-2 px-3 bg-cyan-600 hover:bg-cyan-500 text-white font-medium rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-cyan-900/20">
                                <span>➕</span> Nuevo Chat de Física
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-3 space-y-1">
                            <div className="text-xs font-semibold text-slate-500 uppercase px-2 mb-1">Historial de Conversaciones</div>
                            {chats.map(chat => (
                                <div 
                                    key={chat.id}
                                    onClick={() => setCurrentChatId(chat.id)}
                                    className={`group flex items-center justify-between p-2.5 rounded-xl cursor-pointer text-sm transition ${chat.id === currentChatId ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 font-medium' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                                >
                                    <span className="truncate pr-2">{chat.title}</span>
                                    {chats.length > 1 && (
                                        <button onClick={(e) => deleteChat(chat.id, e)} className="opacity-0 group-hover:opacity-100 p-1 hover:text-red-400 text-slate-500 transition">
                                            🗑️
                                        </button>
                                    )}
                                </div>
                            ))}
                        </div>

                        <div className="p-3 border-t border-slate-800 space-y-2">
                            <button 
                                onClick={() => setActiveTab('simuladores')} 
                                className={`w-full py-2 px-3 rounded-xl text-sm font-medium flex items-center gap-2 transition ${activeTab === 'simuladores' ? 'bg-slate-800 text-cyan-400' : 'text-slate-400 hover:bg-slate-900'}`}
                            >
                                📊 Ver Fórmulas y Bloques
                            </button>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col bg-slate-950 overflow-hidden">
                        {activeTab === 'simuladores' ? (
                            <div className="flex-1 flex flex-col h-full overflow-y-auto p-6 max-w-5xl mx-auto w-full">
                                <div className="mb-6">
                                    <h2 className="text-2xl font-bold text-white mb-2">Bloques de Física Exclusivos</h2>
                                    <p className="text-slate-400 text-sm">Termodinámica, Electromagnetismo y Óptica con fórmulas clave.</p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                                    {TOPICS.map(t => (
                                        <div 
                                            key={t.id}
                                            onClick={() => setSelectedTopic(t.id)}
                                            className={`p-5 rounded-2xl border cursor-pointer transition ${selectedTopic === t.id ? 'bg-cyan-950/30 border-cyan-500 shadow-lg shadow-cyan-950/50' : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'}`}
                                        >
                                            <span className="text-xs text-cyan-400 font-semibold uppercase">{t.category}</span>
                                            <h3 className="text-lg font-bold text-white mt-1 mb-2">{t.name}</h3>
                                            <p className="text-slate-400 text-xs leading-relaxed">{t.description}</p>
                                        </div>
                                    ))}
                                </div>

                                {(() => {
                                    const topicData = TOPICS.find(t => t.id === selectedTopic);
                                    return (
                                        <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 mb-8">
                                            <h3 className="text-xl font-bold text-white mb-4">Fórmulas Clave de {topicData.name}</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                {topicData.formulas.map((f, i) => (
                                                    <div key={i} className="p-4 bg-slate-950 rounded-xl border border-slate-800/80">
                                                        <div className="text-sm font-medium text-slate-300 mb-2">{f.name}</div>
                                                        <div className="text-cyan-400 font-mono text-lg">{f.eq}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        ) : null}

                        <div className="flex-1 flex flex-col h-full bg-slate-950">
                            <div className="p-4 border-b border-slate-800 bg-slate-950/80 backdrop-blur flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
                                    <span className="font-semibold text-white">Tutor IA Estricto de Física</span>
                                </div>
                                <span className="text-xs bg-cyan-950 text-cyan-400 px-2.5 py-1 rounded-full border border-cyan-800/50">Restringido exclusivamente a Física</span>
                            </div>

                            <div className="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl mx-auto w-full">
                                {currentChat.messages.map((msg, index) => (
                                    <div key={index} className={`flex gap-3 ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        {msg.role === 'assistant' && (
                                            <div className="w-8 h-8 rounded-full bg-cyan-600 flex items-center justify-center text-white font-bold text-sm shrink-0 shadow">IA</div>
                                        )}
                                        <div className={`max-w-[80%] rounded-2xl p-4 text-sm leading-relaxed ${msg.role === 'user' ? 'bg-cyan-600 text-white rounded-br-none' : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-none shadow-xl'}`}>
                                            {msg.image && (
                                                <div className="mb-3">
                                                    <img src={msg.image} alt="Imagen adjunta" className="max-h-48 rounded-xl object-contain border border-slate-700" />
                                                </div>
                                            )}
                                            <div className="whitespace-pre-wrap">{msg.content}</div>
                                        </div>
                                        {msg.role === 'user' && (
                                            <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-white font-bold text-sm shrink-0">Tú</div>
                                        )}
                                    </div>
                                ))}
                                {loadingAI && (
                                    <div className="flex gap-3 items-center text-slate-400 text-sm">
                                        <div className="w-8 h-8 rounded-full bg-cyan-600 flex items-center justify-center text-white font-bold text-sm animate-spin">⚛️</div>
                                        <div className="bg-slate-900 border border-slate-800 p-3 rounded-2xl">La IA está calculando y analizando el problema de física...</div>
                                    </div>
                                )}
                                <div ref={chatEndRef} />
                            </div>

                            <div className="p-4 bg-slate-900 border-t border-slate-800">
                                <form onSubmit={handleSendMessage} className="max-w-4xl mx-auto flex flex-col gap-2">
                                    {selectedImage && (
                                        <div className="flex items-center gap-2 bg-slate-950 p-2 rounded-xl border border-slate-800 w-fit">
                                            <img src={selectedImage} alt="Preview" className="w-12 h-12 object-cover rounded-lg" />
                                            <span className="text-xs text-slate-300">Imagen lista para analizar</span>
                                            <button type="button" onClick={removeSelectedImage} className="text-red-400 hover:text-red-300 px-2 font-bold">×</button>
                                        </div>
                                    )}
                                    <div className="flex items-center gap-2">
                                        <input 
                                            type="file" 
                                            accept="image/*" 
                                            ref={fileInputRef} 
                                            onChange={handleImageSelect} 
                                            className="hidden" 
                                        />
                                        <button 
                                            type="button" 
                                            onClick={() => fileInputRef.current?.click()}
                                            className="p-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition flex items-center justify-center"
                                            title="Adjuntar imagen de circuito, diagrama o problema"
                                        >
                                            🖼️
                                        </button>
                                        <input 
                                            type="text" 
                                            value={inputMessage}
                                            onChange={(e) => setInputMessage(e.target.value)}
                                            placeholder="Pregunta sobre Termodinámica, Electromagnetismo, Óptica o sube tu problema..."
                                            className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 text-sm"
                                        />
                                        <button 
                                            type="submit" 
                                            disabled={loadingAI || (!inputMessage.trim() && !selectedImage)}
                                            className="bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 text-white font-medium px-5 py-3 rounded-xl transition text-sm shadow-lg shadow-cyan-900/20"
                                        >
                                            Enviar
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
