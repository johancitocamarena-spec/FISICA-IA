<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Física Master IA - Tutor y Simuladores</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- KaTeX for Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
        }
        /* Scrollbars personalizados */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        @keyframes pulseFlow {
            to {
                stroke-dashoffset: -32;
            }
        }
        .flow-line {
            stroke-dasharray: 7 9;
            animation: pulseFlow linear infinite;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-enter {
            animation: fadeSlideUp 0.24s ease-out forwards;
        }
        @keyframes jitterParticle {
            0%, 100% { transform: translate(0px, 0px); }
            25% { transform: translate(4px, -4px); }
            50% { transform: translate(-4px, 3px); }
            75% { transform: translate(3px, 4px); }
        }
        .thermal-dot {
            animation: jitterParticle ease-in-out infinite;
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col selection:bg-cyan-500/20 selection:text-cyan-900">
    <div id="root" class="h-full w-full flex"></div>
    <script type="text/babel">
        // ============================================================================
        // CONFIGURACIÓN DE API KEY:
        // Si deseas dejar tu clave fija en el código, pégala dentro de las comillas.
        // ============================================================================
        const DEFAULT_API_KEY = "AQ.Ab8RN6K6FzwLed_vg4G6kunboP9KKLWW7aATeCd0z4wCoAkCPw";

        const DYNAMIC_ACCENTS = {
            cyan: {
                name: 'Cian',
                swatch: 'bg-cyan-500',
                btn: 'from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 shadow-cyan-500/20',
                activeChat: 'bg-cyan-50 text-cyan-800 border-cyan-300 font-semibold',
                activeIcon: 'text-cyan-600',
                badge: 'text-cyan-700 bg-cyan-50 border-cyan-200',
                dot: 'bg-cyan-500',
                focus: 'focus-within:border-cyan-400 focus-within:ring-4 focus-within:ring-cyan-500/10',
                circuit: '#0891b2'
            },
            emerald: {
                name: 'Esmeralda',
                swatch: 'bg-emerald-500',
                btn: 'from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 shadow-emerald-500/20',
                activeChat: 'bg-emerald-50 text-emerald-800 border-emerald-300 font-semibold',
                activeIcon: 'text-emerald-600',
                badge: 'text-emerald-700 bg-emerald-50 border-emerald-200',
                dot: 'bg-emerald-500',
                focus: 'focus-within:border-emerald-400 focus-within:ring-4 focus-within:ring-emerald-500/10',
                circuit: '#059669'
            },
            violet: {
                name: 'Violeta',
                swatch: 'bg-violet-500',
                btn: 'from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 shadow-violet-500/20',
                activeChat: 'bg-violet-50 text-violet-800 border-violet-300 font-semibold',
                activeIcon: 'text-violet-600',
                badge: 'text-violet-700 bg-violet-50 border-violet-200',
                dot: 'bg-violet-500',
                focus: 'focus-within:border-violet-400 focus-within:ring-4 focus-within:ring-violet-500/10',
                circuit: '#7c3aed'
            }
        };

        const { useState, useEffect, useRef } = React;

        // Componente auxiliar para renderizar fórmulas con KaTeX de forma segura
        function Formula({ tex, display = false }) {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.katex) {
                    try {
                        window.katex.render(tex, containerRef.current, {
                            throwOnError: false,
                            displayMode: display
                        });
                    } catch (e) {
                        containerRef.current.textContent = tex;
                    }
                }
            }, [tex, display]);
            return <span ref={containerRef} className={display ? "block my-2 overflow-x-auto" : "inline-block"} />;
        }

        // Componente de Iconos Lucide
        function Icon({ name, className = "w-4 h-4" }) {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center shrink-0" />;
        }

        // Datos de Temas de Física
        const TOPICS_DATA = [
            {
                id: 'termodinamica',
                title: 'Termodinámica',
                subtitle: 'Calor, Trabajo y Leyes Térmicas',
                color: 'from-orange-500 to-rose-600',
                badgeColor: 'text-orange-700 bg-orange-50 border-orange-200',
                icon: 'flame',
                description: 'Estudio de la transferencia de energía en forma de calor y trabajo mecánico en sistemas macroscópicos.',
                formulas: [
                    { name: 'Primera Ley de la Termodinámica', tex: 'ΔU = Q - W' },
                    { name: 'Calor Sensible', tex: 'Q = m \\cdot c \\cdot \\Delta T' },
                    { name: 'Eficiencia Máxima (Carnot)', tex: '\\eta = 1 - \\frac{T_C}{T_H}' }
                ]
            },
            {
                id: 'electromagnetismo',
                title: 'Electromagnetismo',
                subtitle: 'Campos, Circuitos e Inducción',
                color: 'from-cyan-500 to-blue-600',
                badgeColor: 'text-cyan-700 bg-cyan-50 border-cyan-200',
                icon: 'zap',
                description: 'Interacción entre cargas eléctricas en reposo o movimiento, circuitos eléctricos y campos magnéticos.',
                formulas: [
                    { name: 'Ley de Ohm', tex: 'V = I \\cdot R' },
                    { name: 'Ley de Coulomb', tex: 'F = k_e \\frac{|q_1 q_2|}{r^2}' },
                    { name: 'Fuerza de Lorentz', tex: '\\vec{F} = q(\\vec{E} + \\vec{v} \\times \\vec{B})' }
                ]
            },
            {
                id: 'optica',
                title: 'Luz y Óptica',
                subtitle: 'Reflexión, Refracción y Lentes',
                color: 'from-violet-500 to-indigo-600',
                badgeColor: 'text-violet-700 bg-violet-50 border-violet-200',
                icon: 'sun',
                description: 'Comportamiento de la luz al propagarse por distintos medios, formación de imágenes en espejos y lentes.',
                formulas: [
                    { name: 'Ley de Snell (Refracción)', tex: 'n_1 \\sin(\\theta_1) = n_2 \\sin(\\theta_2)' },
                    { name: 'Ecuación de Lentes Delgadas', tex: '\\frac{1}{f} = \\frac{1}{d_o} + \\frac{1}{d_i}' },
                    { name: 'Índice de Refracción', tex: 'n = \\frac{c}{v}' }
                ]
            }
        ];

        function App() {
            // Navegación principal: 'chat' o 'simuladores' (Nunca ambas al mismo tiempo)
            const [activeTab, setActiveTab] = useState('chat');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            // Color dinámico de acento en modo claro
            const [accentKey, setAccentKey] = useState(() => {
                return localStorage.getItem('fisica_master_light_accent') || 'cyan';
            });
            const accent = DYNAMIC_ACCENTS[accentKey] || DYNAMIC_ACCENTS.cyan;
            useEffect(() => {
                localStorage.setItem('fisica_master_light_accent', accentKey);
            }, [accentKey]);

            // Gestión de API Key (Prioridad: localStorage -> DEFAULT_API_KEY)
            const [apiKey] = useState(() => {
                return localStorage.getItem('fisica_master_api_key') || DEFAULT_API_KEY;
            });

            // Gestión de Historial de Chats en localStorage
            const [chats, setChats] = useState(() => {
                try {
                    const saved = localStorage.getItem('fisica_master_chats_v2');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                    }
                } catch (e) {
                    console.error("Error leyendo localStorage:", e);
                }
                return [{
                    id: 'chat_init',
                    title: 'Consulta de Física',
                    messages: [{
                        role: 'model',
                        content: '¡Hola! Soy **Física Master IA**, tu tutor especializado exclusivamente en **Física** (Termodinámica, Electromagnetismo, Óptica, Mecánica, etc.).\n\nEscribe tu duda, dicta por voz, envía un audio o adjunta una foto de un problema, circuito o diagrama para resolverlo paso a paso.'
                    }]
                }];
            });

            const [currentChatId, setCurrentChatId] = useState(() => chats[0]?.id || 'chat_init');

            // Guardar chats automáticamente en localStorage (omitiendo base64 pesados si excede cuota)
            useEffect(() => {
                try {
                    localStorage.setItem('fisica_master_chats_v2', JSON.stringify(chats));
                } catch (e) {
                    try {
                        const lightChats = chats.map(c => ({
                            ...c,
                            messages: c.messages.map(m => ({
                                ...m,
                                image: null,
                                audio: null
                            }))
                        }));
                        localStorage.setItem('fisica_master_chats_v2', JSON.stringify(lightChats));
                    } catch (err2) {
                        console.error("Error guardando chats en localStorage:", err2);
                    }
                }
            }, [chats]);

            const currentChat = chats.find(c => c.id === currentChatId) || chats[0];

            // Estados del Chat Activo (texto, imagen, audio, reconocimiento de voz)
            const [inputMessage, setInputMessage] = useState('');
            const [selectedImage, setSelectedImage] = useState(null);
            const [selectedAudio, setSelectedAudio] = useState(null);
            const [isRecordingAudio, setIsRecordingAudio] = useState(false);
            const [isRecognizingSpeech, setIsRecognizingSpeech] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [statusBanner, setStatusBanner] = useState(null);

            const fileInputRef = useRef(null);
            const audioInputRef = useRef(null);
            const messagesEndRef = useRef(null);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);
            const speechRecognitionRef = useRef(null);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [currentChat?.messages, isLoading, activeTab]);

            useEffect(() => {
                return () => {
                    if (speechRecognitionRef.current) {
                        try { speechRecognitionRef.current.stop(); } catch (e) {}
                    }
                    if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
                        try { mediaRecorderRef.current.stop(); } catch (e) {}
                    }
                };
            }, []);

            // Crear nuevo chat
            const createNewChat = () => {
                const newId = 'chat_' + Date.now();
                const newSession = {
                    id: newId,
                    title: 'Nueva Sesión de Física',
                    messages: [{
                        role: 'model',
                        content: '¡Nueva sesión iniciada! Recuerda que estoy programado exclusivamente para responder temas de Física. ¿Qué ejercicio o concepto analizamos hoy?'
                    }]
                };
                setChats(prev => [newSession, ...prev]);
                setCurrentChatId(newId);
                setActiveTab('chat');
                setMobileMenuOpen(false);
            };

            // Borrar chat
            const deleteChat = (id, e) => {
                e.stopPropagation();
                if (chats.length <= 1) {
                    setStatusBanner("Debe existir al menos una sesión activa.");
                    setTimeout(() => setStatusBanner(null), 3000);
                    return;
                }
                const updated = chats.filter(c => c.id !== id);
                setChats(updated);
                if (currentChatId === id) {
                    setCurrentChatId(updated[0].id);
                }
            };

            // Manejo de selección de imagen
            const handleImageUpload = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    setStatusBanner("Por favor, selecciona un archivo de imagen válido.");
                    setTimeout(() => setStatusBanner(null), 3000);
                    return;
                }
                const reader = new FileReader();
                reader.onloadend = () => {
                    setSelectedImage(reader.result);
                };
                reader.readAsDataURL(file);
            };

            const clearImage = () => {
                setSelectedImage(null);
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            // Manejo de archivo de audio adjunto
            const handleAudioFileUpload = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                if (!file.type.startsWith('audio/')) {
                    setStatusBanner("Por favor, selecciona un archivo de audio válido.");
                    setTimeout(() => setStatusBanner(null), 3000);
                    return;
                }
                const reader = new FileReader();
                reader.onloadend = () => {
                    setSelectedAudio({
                        dataUrl: reader.result,
                        name: file.name,
                        mimeType: file.type || 'audio/mp3'
                    });
                };
                reader.readAsDataURL(file);
            };

            const clearAudio = () => {
                setSelectedAudio(null);
                if (audioInputRef.current) audioInputRef.current.value = '';
            };

            // Grabar nota de audio para enviar y reconocer con Gemini
            const toggleAudioRecording = async () => {
                if (isRecordingAudio) {
                    try {
                        mediaRecorderRef.current?.stop();
                    } catch (e) {}
                    setIsRecordingAudio(false);
                    return;
                }

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    setStatusBanner("Tu navegador no soporta grabación de audio.");
                    setTimeout(() => setStatusBanner(null), 3500);
                    return;
                }

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioChunksRef.current = [];
                    const recorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = recorder;

                    recorder.ondataavailable = (event) => {
                        if (event.data && event.data.size > 0) {
                            audioChunksRef.current.push(event.data);
                        }
                    };

                    recorder.onstop = () => {
                        const mimeType = recorder.mimeType || 'audio/webm';
                        const blob = new Blob(audioChunksRef.current, { type: mimeType });
                        stream.getTracks().forEach(t => t.stop());
                        if (blob.size === 0) return;

                        const reader = new FileReader();
                        reader.onloadend = () => {
                            setSelectedAudio({
                                dataUrl: reader.result,
                                name: 'Nota de voz.webm',
                                mimeType
                            });
                        };
                        reader.readAsDataURL(blob);
                    };

                    recorder.start();
                    setIsRecordingAudio(true);
                } catch (err) {
                    setStatusBanner("No se pudo acceder al micrófono. Revisa los permisos del navegador.");
                    setTimeout(() => setStatusBanner(null), 3500);
                }
            };

            // Reconocimiento de voz en tiempo real hacia el campo de texto
            const toggleSpeechRecognition = () => {
                if (isRecognizingSpeech) {
                    try {
                        speechRecognitionRef.current?.stop();
                    } catch (e) {}
                    setIsRecognizingSpeech(false);
                    return;
                }

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    setStatusBanner("Reconocimiento de voz en vivo no disponible aquí; usa el botón de grabar audio.");
                    setTimeout(() => setStatusBanner(null), 4000);
                    return;
                }

                const recognition = new SpeechRecognition();
                speechRecognitionRef.current = recognition;
                recognition.lang = 'es-ES';
                recognition.interimResults = true;
                recognition.continuous = false;

                const baseText = inputMessage.trim();

                recognition.onstart = () => {
                    setIsRecognizingSpeech(true);
                };

                recognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = 0; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }
                    const combined = baseText ? `${baseText} ${transcript}`.trim() : transcript.trim();
                    setInputMessage(combined);
                };

                recognition.onerror = () => {
                    setIsRecognizingSpeech(false);
                    setStatusBanner("Error en el reconocimiento de voz. Intenta de nuevo.");
                    setTimeout(() => setStatusBanner(null), 3000);
                };

                recognition.onend = () => {
                    setIsRecognizingSpeech(false);
                };

                try {
                    recognition.start();
                } catch (e) {
                    setIsRecognizingSpeech(false);
                }
            };

            // Envío de mensaje (texto, imagen y/o audio) a Gemini API
            const handleSendMessage = async (e) => {
                if (e) e.preventDefault();
                if ((!inputMessage.trim() && !selectedImage && !selectedAudio) || isLoading) return;

                if (isRecognizingSpeech && speechRecognitionRef.current) {
                    try { speechRecognitionRef.current.stop(); } catch (err) {}
                    setIsRecognizingSpeech(false);
                }
                if (isRecordingAudio && mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
                    try { mediaRecorderRef.current.stop(); } catch (err) {}
                    setIsRecordingAudio(false);
                }

                const effectiveKey = (apiKey || DEFAULT_API_KEY).trim();
                if (!effectiveKey) {
                    setStatusBanner("Ingresa tu API Key de Gemini en DEFAULT_API_KEY antes de enviar.");
                    setTimeout(() => setStatusBanner(null), 4500);
                    return;
                }

                const userMsg = {
                    role: 'user',
                    content: inputMessage.trim(),
                    image: selectedImage,
                    audio: selectedAudio
                };

                const updatedChats = chats.map(c => {
                    if (c.id === currentChatId) {
                        const newMessages = [...c.messages, userMsg];
                        let newTitle = c.title;
                        if (c.messages.length <= 1 && userMsg.content) {
                            newTitle = userMsg.content.slice(0, 28) + (userMsg.content.length > 28 ? '...' : '');
                        } else if (c.messages.length <= 1 && userMsg.audio) {
                            newTitle = 'Consulta de Audio Física';
                        } else if (c.messages.length <= 1 && userMsg.image) {
                            newTitle = 'Análisis de Imagen Física';
                        }
                        return { ...c, title: newTitle, messages: newMessages };
                    }
                    return c;
                });

                setChats(updatedChats);
                setInputMessage('');
                clearImage();
                clearAudio();
                setIsLoading(true);

                try {
                    const systemPrompt = `Eres "Física Master IA", un tutor y profesor universitario experto especializado EXCLUSIVAMENTE en Física (Termodinámica, Electromagnetismo, Óptica, Mecánica Clásica, Física Moderna, etc.).
REGLA ESTRICTA E INQUEBRANTABLE:
Nunca uses código LaTeX, signos de dólar ($), barras invertidas (\\Delta, \\frac), asteriscos (**) ni almohadillas (###). Escribe todas las ecuaciones y unidades usando texto plano limpio y símbolos Unicode normales (por ejemplo: ΔU = Q - W, θ, η, ×, ÷, ², ³, √).
Tu única área de conocimiento permitida es la FÍSICA. Si el usuario te pregunta, pide ayuda o conversa sobre cualquier tema ajeno a la física (por ejemplo: programación, historia, cocina, política, entretenimiento, biología sin enfoque biofísico, o matemáticas puras sin aplicación física), debes rechazar la solicitud de manera amable, breve y profesional, indicándole que estás programado exclusivamente para asistir con temas y problemas de Física.
Si el usuario envía un audio, primero reconoce y transcribe brevemente lo que dijo o preguntó (si trata de Física), y luego resuelve el problema o responde la consulta de Física siguiendo estos pasos:
1. Identifica los principios o leyes físicas involucradas.
2. Extrae los datos conocidos y las incógnitas con sus unidades en el Sistema Internacional (SI).
3. Muestra las fórmulas y desarrolla la resolución paso a paso con claridad y rigor científico.`;

                    const conversationHistory = currentChat.messages.concat([userMsg]).map(msg => {
                        const parts = [];
                        if (msg.content) parts.push({ text: msg.content });
                        if (msg.image) {
                            const commaIdx = msg.image.indexOf(',');
                            const mimeType = msg.image.substring(5, msg.image.indexOf(';'));
                            const base64Data = msg.image.substring(commaIdx + 1);
                            parts.push({
                                inline_data: {
                                    mime_type: mimeType,
                                    data: base64Data
                                }
                            });
                        }
                        if (msg.audio && msg.audio.dataUrl) {
                            const commaIdx = msg.audio.dataUrl.indexOf(',');
                            const parsedMime = msg.audio.dataUrl.substring(5, msg.audio.dataUrl.indexOf(';'));
                            const mimeType = parsedMime || msg.audio.mimeType || 'audio/webm';
                            const base64Data = msg.audio.dataUrl.substring(commaIdx + 1);
                            parts.push({
                                inline_data: {
                                    mime_type: mimeType,
                                    data: base64Data
                                }
                            });
                        }
                        return {
                            role: msg.role === 'user' ? 'user' : 'model',
                            parts
                        };
                    });

                    const response = await fetch(
                        `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${effectiveKey}`,
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                system_instruction: { parts: [{ text: systemPrompt }] },
                                contents: conversationHistory
                            })
                        }
                    );

                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.error?.message || `Error HTTP ${response.status}`);
                    }

                    const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text || "No se recibió respuesta del modelo.";
                    const aiMsg = { role: 'model', content: replyText };
                    setChats(prev => prev.map(c =>
                        c.id === currentChatId ? { ...c, messages: [...c.messages, aiMsg] } : c
                    ));
                } catch (err) {
                    console.error("Error API Gemini:", err);
                    const errorMsg = {
                        role: 'model',
                        content: `**Error al conectar con Gemini:** ${err.message}\n\nVerifica que tu API Key de Gemini sea válida y tenga permisos activos.`
                    };
                    setChats(prev => prev.map(c =>
                        c.id === currentChatId ? { ...c, messages: [...c.messages, errorMsg] } : c
                    ));
                } finally {
                    setIsLoading(false);
                }
            };

            // ========================================================================
            // ESTADOS DE LOS SIMULADORES INTERACTIVOS (PESTAÑA 2)
            // ========================================================================
            // 1. Termodinámica: Calor Sensible Q = m * c * ΔT
            const [mass, setMass] = useState(2); // kg
            const [specificHeat, setSpecificHeat] = useState(4186); // J/(kg·K) Agua
            const [deltaT, setDeltaT] = useState(15); // °C o K
            const heatQ = (Number(mass) * Number(specificHeat) * Number(deltaT)).toFixed(2);
            const heatBarPct = Math.min(100, Math.max(8, Math.abs(Number(deltaT))));
            const jitterSpeed = Math.max(0.25, 1.7 - Math.abs(Number(deltaT)) * 0.015).toFixed(2);

                ? "Reflexión Interna Total"
                : theta2Deg.toFixed(2) + "°";

            const startX = 150 - Math.sin(radInc) * rayLength;
            const startY = 75 - Math.cos(radInc) * rayLength;
            const radRef = isTotalInternalReflection ? -radInc : (theta2Deg * Math.PI) / 180;

                                                            <option value="4186">Agua Líquida (4186 J/kg·K)</option>
                                                            <option value="900">Aluminio (900 J/kg·K)</option>
                                                            <option value="385">Cobre (385 J/kg·K)</option>
                                                            <option value="450">Hierro (450 J/kg·K)</option>
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="flex justify-between text-slate-700 font-medium mb-1">
                                                            <span>Variación Temp. (ΔT):</span>
                                                            <span className="font-mono text-orange-600 font-semibold">{deltaT} K</span>
                                                        </label>
                                                        <input type="range" min="-50" max="100" step="1" value={deltaT} onChange={e => setDeltaT(e.target.value)} className="w-full accent-orange-500 cursor-pointer" />
                                                    </div>
                                                </div>
                                                <div className="bg-orange-50 border border-orange-200 rounded-xl p-3.5 text-center">
                                                    <span className="text-[11px] text-slate-600 block">Calor Transferido (Q)</span>
                                                    <span className="text-lg font-extrabold text-orange-600 font-mono">{heatQ} J</span>
                                                </div>
                                            </div>

                                            {/* Simulador 2: Ley de Ohm (Electromagnetismo) */}
                                            <div className="bg-white border border-slate-200 hover:border-cyan-300 rounded-2xl p-6 space-y-4 shadow-xs hover:shadow-md transition-all">
                                                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                                    <h4 className="font-bold text-cyan-700 text-sm">2. Ley de Ohm (Electromagnetismo)</h4>
                                                    <Formula tex="V = I \cdot R" />
                                                </div>

                                                {/* Circuito animado en claro */}
                                                <div className="bg-slate-50 border border-slate-200/80 rounded-xl p-2 flex justify-center">
                                                    <svg viewBox="0 0 260 88" className="w-full h-22">
                                                        <rect x="28" y="14" width="204" height="58" rx="10" fill="none" stroke="#e2e8f0" strokeWidth="5" />
                                                        <rect
                                                            x="28"
                                                            y="14"
                                                            width="204"
                                                            height="58"
                                                            rx="10"
                                                            fill="none"
                                                            stroke={accent.circuit}
                                                            strokeWidth="3"
                                                            className="flow-line"
                                                            style={{ animationDuration: `${circuitFlowSec}s` }}
                                                        />
                                                        <rect x="12" y="31" width="32" height="24" rx="5" fill="#ffffff" stroke="#0891b2" strokeWidth="1.5" />
                                                        <text x="28" y="46" textAnchor="middle" fill="#0e7490" fontSize="9" fontWeight="bold">{voltageV}V</text>
                                                        <rect x="216" y="29" width="32" height="28" rx="5" fill="#ffffff" stroke="#d97706" strokeWidth="1.5" />
                                                        <text x="232" y="46" textAnchor="middle" fill="#b45309" fontSize="9" fontWeight="bold">{resistanceR}Ω</text>
                                                    </svg>
                                                </div>

                                                <div className="space-y-3 text-xs">
                                                    <div>
                                                        <label className="flex justify-between text-slate-700 font-medium mb-1">
                                                            <span>Corriente Eléctrica (I):</span>
                                                            <span className="font-mono text-cyan-700 font-semibold">{currentI} A</span>
                                                        </label>
                                                        <input type="range" min="0.1" max="15" step="0.1" value={currentI} onChange={e => setCurrentI(e.target.value)} className="w-full accent-cyan-600 cursor-pointer" />
                                                    </div>
                                                    <div>
                                                        <label className="flex justify-between text-slate-700 font-medium mb-1">
                                                            <span>Resistencia (R):</span>
                                                            <span className="font-mono text-cyan-700 font-semibold">{resistanceR} Ω</span>
                                                        </label>
                                                        <input type="range" min="1" max="100" step="1" value={resistanceR} onChange={e => setResistanceR(e.target.value)} className="w-full accent-cyan-600 cursor-pointer" />
                                                    </div>
                                                </div>
                                                <div className="grid grid-cols-2 gap-2 pt-2">
                                                    <div className="bg-cyan-50 border border-cyan-200 rounded-xl p-3 text-center">
                                                        <span className="text-[10px] text-slate-600 block">Voltaje (V)</span>
                                                        <span className="text-base font-extrabold text-cyan-700 font-mono">{voltageV} V</span>
                                                    </div>
                                                    <div className="bg-blue-50 border border-blue-200 rounded-xl p-3 text-center">
                                                        <span className="text-[10px] text-slate-600 block">Potencia (P)</span>
                                                        <span className="text-base font-extrabold text-blue-700 font-mono">{powerP} W</span>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Simulador 3: Ley de Snell (Óptica) */}
                                            <div className="bg-white border border-slate-200 hover:border-violet-300 rounded-2xl p-6 space-y-4 shadow-xs hover:shadow-md transition-all">
                                                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                                    <h4 className="font-bold text-violet-700 text-sm">3. Ley de Snell (Óptica)</h4>
                                                    <Formula tex="n_1 \sin\theta_1 = n_2 \sin\theta_2" />
                                                </div>

                                                {/* Haz óptico dinámico */}
                                                <div className="bg-slate-50 border border-slate-200/80 rounded-xl p-2 flex justify-center">
                                                    <svg viewBox="0 0 300 146" className="w-full h-24">
                                                        <rect x="0" y="73" width="300" height="73" fill="rgba(139, 92, 246, 0.12)" />
                                                        <line x1="0" y1="73" x2="300" y2="73" stroke="#94a3b8" strokeWidth="1.5" />
                                                        <line x1="150" y1="8" x2="150" y2="138" stroke="#cbd5e1" strokeDasharray="4 4" strokeWidth="1.2" />
                                                        <line x1={startX} y1={startY} x2="150" y2="73" stroke="#f59e0b" strokeWidth="2.5" />
                                                        <line
                                                            x1="150"
                                                            y1="73"
                                                            x2={endX}
                                                            y2={endY}
                                                            stroke={isTotalInternalReflection ? "#e11d48" : "#7c3aed"}
                                                            strokeWidth="2.5"
                                                        />
                                                        <text x="12" y="18" fill="#475569" fontSize="9" fontWeight="600">n₁ = {n1}</text>
                                                        <text x="12" y="136" fill="#6d28d9" fontSize="9" fontWeight="600">n₂ = {n2}</text>
                                                    </svg>
                                                </div>

                                                <div className="space-y-3 text-xs">
                                                    <div className="grid grid-cols-2 gap-2">
                                                        <div>
                                                            <label className="text-slate-700 font-medium block mb-1">Medio 1 (n₁):</label>
                                                            <select value={n1} onChange={e => setN1(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg p-1.5 text-slate-800">
                                                                <option value="1.0">Aire (1.00)</option>
                                                                <option value="1.33">Agua (1.33)</option>
                                                                <option value="1.52">Vidrio (1.52)</option>
                                                                <option value="2.42">Diamante (2.42)</option>
                                                            </select>
                                                        </div>
                                                        <div>
                                                            <label className="text-slate-700 font-medium block mb-1">Medio 2 (n₂):</label>
                                                            <select value={n2} onChange={e => setN2(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg p-1.5 text-slate-800">
                                                                <option value="1.0">Aire (1.00)</option>
                                                                <option value="1.33">Agua (1.33)</option>
                                                                <option value="1.52">Vidrio (1.52)</option>
                                                                <option value="2.42">Diamante (2.42)</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <label className="flex justify-between text-slate-700 font-medium mb-1">
                                                            <span>Ángulo de Incidencia (θ₁):</span>
                                                            <span className="font-mono text-violet-700 font-semibold">{theta1}°</span>
                                                        </label>
                                                        <input type="range" min="0" max="89" step="1" value={theta1} onChange={e => setTheta1(e.target.value)} className="w-full accent-violet-600 cursor-pointer" />
                                                    </div>
                                                </div>
                                                <div className="bg-violet-50 border border-violet-200 rounded-xl p-3.5 text-center">
                                                    <span className="text-[11px] text-slate-600 block">Ángulo Refractado (θ₂)</span>
                                                    <span className="text-base font-extrabold text-violet-700 font-mono">{theta2}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
