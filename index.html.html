<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Física Master IA - Tutor y Simuladores</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- KaTeX for Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #0f1117;
            color: #f8fafc;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2c3347;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f4863;
        }
        @keyframes pulseFlow {
            to {
                stroke-dashoffset: -32;
            }
        }
        .flow-line {
            stroke-dasharray: 7 9;
            animation: pulseFlow linear infinite;
        }
        @keyframes floatOrb {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(16px, -14px) scale(1.08); }
        }
        .ambient-orb {
            animation: floatOrb 7s ease-in-out infinite;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(10px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .msg-enter {
            animation: fadeSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes jitterParticle {
            0%, 100% { transform: translate(0px, 0px); }
            25% { transform: translate(4px, -4px); }
            50% { transform: translate(-4px, 3px); }
            75% { transform: translate(3px, 4px); }
        }
        .thermal-dot {
            animation: jitterParticle ease-in-out infinite;
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col selection:bg-emerald-500/30 selection:text-emerald-200">
    <div id="root" class="h-full w-full flex"></div>
    <script type="text/babel">
        // ============================================================================
        // CONFIGURACIÓN DE API KEY Y MODELOS:
        // Si deseas dejar tu clave fija en el código, pégala dentro de las comillas.
        // ============================================================================
        const DEFAULT_API_KEY = "";
        const MODEL_CANDIDATES = [
            "gemini-3.8-flash",
            "gemini-2.0-flash",
            "gemini-2.5-flash"
        ];

        const ACCENT_THEMES = {
            emerald: {
                name: 'Esmeralda',
                swatch: 'bg-emerald-400',
                primaryBtn: 'from-emerald-500 via-teal-500 to-cyan-600 hover:from-emerald-400 hover:via-teal-400 hover:to-cyan-500 shadow-emerald-950/60',
                activeChat: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/35',
                activeIcon: 'text-emerald-400',
                badge: 'text-emerald-300 bg-emerald-500/10 border-emerald-500/25',
                dot: 'bg-emerald-400',
                orb1: 'bg-emerald-500/15',
                orb2: 'bg-fuchsia-500/15',
                focusBorder: 'focus-within:border-emerald-500/60',
                circuitStroke: '#34d399',
                avatarGrad: 'from-emerald-500 via-teal-500 to-fuchsia-600'
            },
            fuchsia: {
                name: 'Fucsia Neón',
                swatch: 'bg-fuchsia-400',
                primaryBtn: 'from-fuchsia-600 via-pink-600 to-rose-600 hover:from-fuchsia-500 hover:via-pink-500 hover:to-rose-500 shadow-fuchsia-950/60',
                activeChat: 'bg-fuchsia-500/15 text-fuchsia-300 border-fuchsia-500/35',
                activeIcon: 'text-fuchsia-400',
                badge: 'text-fuchsia-300 bg-fuchsia-500/10 border-fuchsia-500/25',
                dot: 'bg-fuchsia-400',
                orb1: 'bg-fuchsia-500/15',
                orb2: 'bg-amber-500/15',
                focusBorder: 'focus-within:border-fuchsia-500/60',
                circuitStroke: '#e879f9',
                avatarGrad: 'from-fuchsia-500 via-pink-500 to-amber-500'
            },
            amber: {
                name: 'Ámbar Solar',
                swatch: 'bg-amber-400',
                primaryBtn: 'from-amber-500 via-orange-500 to-rose-600 hover:from-amber-400 hover:via-orange-400 hover:to-rose-500 shadow-amber-950/60',
                activeChat: 'bg-amber-500/15 text-amber-300 border-amber-500/35',
                activeIcon: 'text-amber-400',
                badge: 'text-amber-300 bg-amber-500/10 border-amber-500/25',
                dot: 'bg-amber-400',
                orb1: 'bg-amber-500/15',
                orb2: 'bg-emerald-500/15',
                focusBorder: 'focus-within:border-amber-500/60',
                circuitStroke: '#fbbf24',
                avatarGrad: 'from-amber-500 via-orange-500 to-emerald-500'
            }
        };

        const { useState, useEffect, useRef } = React;

        function Formula({ tex, display = false }) {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.katex) {
                    try {
                        window.katex.render(tex, containerRef.current, {
                            throwOnError: false,
                            displayMode: display
                        });
                    } catch (e) {
                        containerRef.current.textContent = tex;
                    }
                }
            }, [tex, display]);
            return <span ref={containerRef} className={display ? "block my-2 overflow-x-auto" : "inline-block"} />;
        }

        function Icon({ name, className = "w-4 h-4" }) {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center shrink-0" />;
        }

        const TOPICS_DATA = [
            {
                id: 'termodinamica',
                title: 'Termodinámica',
                subtitle: 'Calor, Trabajo y Leyes Térmicas',
                color: 'from-amber-500 via-orange-500 to-rose-600',
                badgeColor: 'text-amber-300 bg-amber-500/15 border-amber-500/30',
                icon: 'flame',
                description: 'Estudio de la transferencia de energía en forma de calor y trabajo mecánico en sistemas macroscópicos.',
                formulas: [
                    { name: 'Primera Ley de la Termodinámica', tex: '\\Delta U = Q - W' },
                    { name: 'Calor Sensible', tex: 'Q = m \\cdot c \\cdot \\Delta T' },
                    { name: 'Eficiencia Máxima (Carnot)', tex: '\\eta = 1 - \\frac{T_C}{T_H}' }
                ]
            },
            {
                id: 'electromagnetismo',
                title: 'Electromagnetismo',
                subtitle: 'Campos, Circuitos e Inducción',
                color: 'from-emerald-400 via-teal-500 to-cyan-600',
                badgeColor: 'text-emerald-300 bg-emerald-500/15 border-emerald-500/30',
                icon: 'zap',
                description: 'Interacción entre cargas eléctricas en reposo o movimiento, circuitos eléctricos y campos magnéticos.',
                formulas: [
                    { name: 'Ley de Ohm', tex: 'V = I \\cdot R' },
                    { name: 'Ley de Coulomb', tex: 'F = k_e \\frac{|q_1 q_2|}{r^2}' },
                    { name: 'Fuerza de Lorentz', tex: '\\vec{F} = q(\\vec{E} + \\vec{v} \\times \\vec{B})' }
                ]
            },
            {
                id: 'optica',
                title: 'Luz y Óptica',
                subtitle: 'Reflexión, Refracción y Lentes',
                color: 'from-fuchsia-500 via-pink-500 to-rose-500',
                badgeColor: 'text-fuchsia-300 bg-fuchsia-500/15 border-fuchsia-500/30',
                icon: 'sun',
                description: 'Comportamiento de la luz al propagarse por distintos medios, formación de imágenes en espejos y lentes.',
                formulas: [
                    { name: 'Ley de Snell (Refracción)', tex: 'n_1 \\sin(\\theta_1) = n_2 \\sin(\\theta_2)' },
                    { name: 'Ecuación de Lentes Delgadas', tex: '\\frac{1}{f} = \\frac{1}{d_o} + \\frac{1}{d_i}' },
                    { name: 'Índice de Refracción', tex: 'n = \\frac{c}{v}' }
                ]
            }
        ];

        const QUICK_PROMPTS = [
            {
                label: "🔥 Calor y cambio de temperatura",
                text: "Calcula el calor necesario para elevar la temperatura de 3 kg de agua desde 20 °C hasta 80 °C (c = 4186 J/kg·K) y explícame cada paso."
            },
            {
                label: "⚡ Circuito con Ley de Ohm",
                text: "Un resistor de 24 Ω está conectado a una fuente de 12 V. Calcula la corriente eléctrica, la potencia disipada y explica el comportamiento del circuito."
            },
            {
                label: "🌈 Refracción con Ley de Snell",
                text: "Un rayo de luz pasa del aire (n1 = 1.00) al vidrio (n2 = 1.52) con un ángulo de incidencia de 35°. Calcula el ángulo de refracción y explica qué ocurre con la luz."
            }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('chat');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            const [themeKey, setThemeKey] = useState(() => {
                return localStorage.getItem('fisica_master_theme') || 'emerald';
            });
            const theme = ACCENT_THEMES[themeKey] || ACCENT_THEMES.emerald;

            useEffect(() => {
                localStorage.setItem('fisica_master_theme', themeKey);
            }, [themeKey]);

            const [apiKey] = useState(() => {
                return localStorage.getItem('fisica_master_api_key') || DEFAULT_API_KEY;
            });

            const [chats, setChats] = useState(() => {
                try {
                    const saved = localStorage.getItem('fisica_master_chats_v2');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                    }
                } catch (e) {
                    console.error("Error leyendo localStorage:", e);
                }
                return [{
                    id: 'chat_init',
                    title: 'Consulta de Física',
                    messages: [{
                        role: 'model',
                        content: '¡Hola! Soy Física Master IA, tu tutor especializado exclusivamente en Física (Termodinámica, Electromagnetismo, Óptica, Mecánica, etc.).\n\nEscribe tu duda, elige un ejemplo rápido o adjunta una foto de un problema, circuito o diagrama para resolverlo paso a paso.'
                    }]
                }];
            });

            const [currentChatId, setCurrentChatId] = useState(() => chats[0]?.id || 'chat_init');

            useEffect(() => {
                try {
                    localStorage.setItem('fisica_master_chats_v2', JSON.stringify(chats));
                } catch (e) {
                    console.error("Error guardando chats:", e);
                }
            }, [chats]);

            const currentChat = chats.find(c => c.id === currentChatId) || chats[0];

            const [inputMessage, setInputMessage] = useState('');
            const [selectedImage, setSelectedImage] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [statusBanner, setStatusBanner] = useState(null);
            const fileInputRef = useRef(null);
            const messagesEndRef = useRef(null);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [currentChat?.messages, isLoading, activeTab]);

            const createNewChat = () => {
                const newId = 'chat_' + Date.now();
                const newSession = {
                    id: newId,
                    title: 'Nueva Sesión de Física',
                    messages: [{
                        role: 'model',
                        content: '¡Nueva sesión iniciada! Recuerda que estoy programado exclusivamente para responder temas de Física. ¿Qué ejercicio o concepto analizamos hoy?'
                    }]
                };
                setChats(prev => [newSession, ...prev]);
                setCurrentChatId(newId);
                setActiveTab('chat');
                setMobileMenuOpen(false);
            };

            const deleteChat = (id, e) => {
                e.stopPropagation();
                if (chats.length <= 1) {
                    setStatusBanner("Debe existir al menos una sesión activa.");
                    setTimeout(() => setStatusBanner(null), 3000);
                    return;
                }
                const updated = chats.filter(c => c.id !== id);
                setChats(updated);
                if (currentChatId === id) {
                    setCurrentChatId(updated[0].id);
                }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    setStatusBanner("Por favor, selecciona un archivo de imagen válido.");
                    setTimeout(() => setStatusBanner(null), 3000);
                    return;
                }
                const reader = new FileReader();
                reader.onloadend = () => {
                    setSelectedImage(reader.result);
                };
                reader.readAsDataURL(file);
            };

            const clearImage = () => {
                setSelectedImage(null);
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            const sendTextToTutor = async (promptText) => {
                setActiveTab('chat');
                await executeGeminiRequest(promptText, null);
            };

            const executeGeminiRequest = async (textContent, imageBase64) => {
                if ((!textContent.trim() && !imageBase64) || isLoading) return;

                const effectiveKey = (apiKey || DEFAULT_API_KEY).trim();
                if (!effectiveKey) {
                    setStatusBanner("Configura tu API Key de Gemini en DEFAULT_API_KEY antes de enviar.");
                    setTimeout(() => setStatusBanner(null), 4500);
                    return;
                }

                const userMsg = {
                    role: 'user',
                    content: textContent.trim(),
                    image: imageBase64
                };

                setChats(prev => prev.map(c => {
                    if (c.id === currentChatId) {
                        const newMessages = [...c.messages, userMsg];
                        let newTitle = c.title;
                        if (c.messages.length <= 1 && userMsg.content) {
                            newTitle = userMsg.content.slice(0, 28) + (userMsg.content.length > 28 ? '...' : '');
                        } else if (c.messages.length <= 1 && userMsg.image) {
                            newTitle = 'Análisis de Imagen Física';
                        }
                        return { ...c, title: newTitle, messages: newMessages };
                    }
                    return c;
                }));

                setInputMessage('');
                clearImage();
                setIsLoading(true);

                try {
                    const systemPrompt = `Eres "Física Master IA", un tutor y profesor universitario experto especializado EXCLUSIVAMENTE en Física (Termodinámica, Electromagnetismo, Óptica, Mecánica Clásica, Física Moderna, etc.).
REGLA ESTRICTA E INQUEBRANTABLE:
Nunca uses código LaTeX, signos de dólar ($), barras invertidas (\\Delta, \\frac), asteriscos (**) ni almohadillas (###). Escribe todas las ecuaciones y unidades usando texto plano limpio y símbolos Unicode normales (por ejemplo: ΔU = Q - W, θ, η, ×, ÷, ², ³, √).
Tu única área de conocimiento permitida es la FÍSICA. Si el usuario te pregunta, pide ayuda o conversa sobre cualquier tema ajeno a la física, debes rechazar la solicitud de manera amable, breve y profesional, indicándole que estás programado exclusivamente para asistir con temas y problemas de Física.
Cuando el usuario envíe consultas o imágenes de Física (diagramas, circuitos, problemas escritos, gráficas):
1. Identifica los principios o leyes físicas involucradas.
2. Extrae los datos conocidos y las incógnitas con sus unidades en el Sistema Internacional (SI).
3. Muestra las fórmulas y desarrolla la resolución paso a paso con claridad y rigor científico.`;

                    const conversationHistory = currentChat.messages.concat([userMsg]).map(msg => {
                        const parts = [];
                        if (msg.content) parts.push({ text: msg.content });
                        if (msg.image) {
                            const commaIdx = msg.image.indexOf(',');
                            const mimeType = msg.image.substring(5, msg.image.indexOf(';'));
                            const base64Data = msg.image.substring(commaIdx + 1);
                            parts.push({
                                inline_data: {
                                    mime_type: mimeType,
                                    data: base64Data
                                }
                            });
                        }
                        return {
                            role: msg.role === 'user' ? 'user' : 'model',
                            parts
                        };
                    });

                    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
                    const delays = [1500, 3000, 5000];
                    let replyText = null;
                    let lastErr = "Error en la respuesta de Gemini.";
                    let firstDemandErr = null;

                    for (const modelId of MODEL_CANDIDATES) {
                        for (let attempt = 0; attempt < delays.length; attempt++) {
                            const response = await fetch(
                                `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${effectiveKey}`,
                                {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        system_instruction: { parts: [{ text: systemPrompt }] },
                                        contents: conversationHistory
                                    })
                                }
                            );

                            const data = await response.json();
                            if (response.ok) {
                                replyText = data.candidates?.[0]?.content?.parts?.[0]?.text || "No se recibió respuesta del modelo.";
                                break;
                            }

                            const msgErr = data.error?.message || `Error HTTP ${response.status} (${modelId})`;
                            lastErr = msgErr;

                            const isDemand = response.status === 503 || response.status === 429 || /high demand|overloaded|try again later|rate limit/i.test(msgErr);
                            if (isDemand) {
                                if (!firstDemandErr) firstDemandErr = msgErr;
                                if (attempt < delays.length - 1) {
                                    await sleep(delays[attempt]);
                                    continue;
                                }
                                break;
                            }

                            const isModelMissing = response.status === 404 || /not found|not supported|no longer available/i.test(msgErr);
                            if (isModelMissing) {
                                break;
                            }

                            throw new Error(msgErr);
                        }
                        if (replyText) break;
                    }

                    if (!replyText) {
                        throw new Error(firstDemandErr || lastErr);
                    }

                    const aiMsg = { role: 'model', content: replyText };
                    setChats(prev => prev.map(c =>
                        c.id === currentChatId ? { ...c, messages: [...c.messages, aiMsg] } : c
                    ));
                } catch (err) {
                    console.error("Error API Gemini:", err);
                    const errorMsg = {
                        role: 'model',
                        content: `Error al conectar con Gemini: ${err.message}\n\nVerifica que tu API Key de Gemini sea válida y tenga permisos activos.`
                    };
                    setChats(prev => prev.map(c =>
                        c.id === currentChatId ? { ...c, messages: [...c.messages, errorMsg] } : c
                    ));
                } finally {
                    setIsLoading(false);
                }
            };

            const handleSendMessage = async (e) => {
                if (e) e.preventDefault();
                await executeGeminiRequest(inputMessage, selectedImage);
            };

            // 1. Termodinámica
            const [mass, setMass] = useState(2);
            const [specificHeat, setSpecificHeat] = useState(4186);
            const [deltaT, setDeltaT] = useState(15);
            const heatQ = (Number(mass) * Number(specificHeat) * Number(deltaT)).toFixed(2);
            const heatIntensity = Math.min(100, Math.max(10, Math.abs(Number(deltaT))));
            const jitterSec = Math.max(0.25, 1.8 - Math.abs(Number(deltaT)) * 0.015).toFixed(2);

            // 2. Electromagnetismo
            const [currentI, setCurrentI] = useState(2.5);
            const [resistanceR, setResistanceR] = useState(12);
            const voltageV = (Number(currentI) * Number(resistanceR)).toFixed(2);
            const powerP = (Number(voltageV) * Number(currentI)).toFixed(2);
            const flowSpeed = Math.max(0.3, Math.min(3.2, 2.0 / Math.max(0.2, Number(currentI))));

            // 3. Óptica
            const [n1, setN1] = useState(1.0);
            const [n2, setN2] = useState(1.33);
            const [theta1, setTheta1] = useState(30);
            const sinTheta2 = (Number(n1) / Number(n2)) * Math.sin((Number(theta1) * Math.PI) / 180);
            const isTotalInternalReflection = Math.abs(sinTheta2) > 1;
            const theta2DegNum = isTotalInternalReflection ? null : (Math.asin(sinTheta2) * 180) / Math.PI;
            const theta2 = isTotalInternalReflection
                ? "Reflexión Interna Total"
                : theta2DegNum.toFixed(2) + "°";

            const rayLen = 58;
            const rad1 = (Number(theta1) * Math.PI) / 180;
            const incStartX = 150 - Math.sin(rad1) * rayLen;
            const incStartY = 75 - Math.cos(rad1) * rayLen;
            const rad2 = isTotalInternalReflection ? -rad1 : (theta2DegNum * Math.PI) / 180;
            const refEndX = 150 + Math.sin(rad2) * rayLen;
            const refEndY = isTotalInternalReflection ? 75 - Math.cos(rad1) * rayLen : 75 + Math.cos(rad2) * rayLen;

            return (
                <div className="flex h-full w-full bg-[#0f1117] text-slate-100 overflow-hidden relative">
                    {/* Orbes ambientales de color dinámico */}
                    <div className={`pointer-events-none fixed -top-24 left-1/4 w-96 h-96 rounded-full ${theme.orb1} blur-3xl ambient-orb transition-colors duration-500`} />
                    <div className={`pointer-events-none fixed bottom-0 right-1/5 w-96 h-96 rounded-full ${theme.orb2} blur-3xl ambient-orb transition-colors duration-500`} style={{ animationDelay: '3s' }} />

                    {mobileMenuOpen && (
                        <div
                            onClick={() => setMobileMenuOpen(false)}
                            className="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 lg:hidden"
                        />
                    )}

                    {/* 1. BARRA LATERAL IZQUIERDA FIJA (w-72) */}
                    <aside className={`fixed lg:static inset-y-0 left-0 z-40 w-72 bg-[#161a24]/95 border-r border-[#2a3042] flex flex-col justify-between transition-transform duration-300 ease-in-out shrink-0 ${mobileMenuOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
                        <div className="p-4 border-b border-[#2a3042] space-y-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <div className={`w-9 h-9 rounded-xl bg-gradient-to-br ${theme.avatarGrad} flex items-center justify-center text-white shadow-lg transition-all duration-300`}>
                                        <Icon name="atom" className="w-5 h-5" />
                                    </div>
                                    <div>
                                        <h1 className="font-bold text-base tracking-tight text-white leading-none">Física Master IA</h1>
                                        <span className={`text-[11px] font-medium ${theme.activeIcon}`}>Tutor Científico</span>
                                    </div>
                                </div>
                                <button
                                    onClick={() => setMobileMenuOpen(false)}
                                    className="lg:hidden p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-[#23293a]"
                                >
                                    <Icon name="x" className="w-5 h-5" />
                                </button>
                            </div>

                            {/* Selector rápido de color dinámico */}
                            <div className="flex items-center justify-between bg-[#0f1117] border border-[#2a3042] rounded-xl px-3 py-2">
                                <span className="text-[11px] text-slate-300 font-medium">Color de energía</span>
                                <div className="flex items-center gap-2">
                                    {Object.entries(ACCENT_THEMES).map(([key, item]) => (
                                        <button
                                            key={key}
                                            type="button"

                                                        <Formula tex="n_1 \sin\theta_1 = n_2 \sin\theta_2" />
                                                    </div>

                                                    <div className="bg-[#11141d] border border-[#272d3f] rounded-xl p-2 flex justify-center">
                                                        <svg viewBox="0 0 300 150" className="w-full h-28">
                                                            <rect x="0" y="75" width="300" height="75" fill="rgba(217, 70, 239, 0.14)" />
                                                            <line x1="0" y1="75" x2="300" y2="75" stroke="#64748b" strokeWidth="1.5" />
                                                            <line x1="150" y1="10" x2="150" y2="140" stroke="#3f4863" strokeDasharray="4 4" strokeWidth="1.2" />
                                                            <line x1={incStartX} y1={incStartY} x2="150" y2="75" stroke="#fbbf24" strokeWidth="2.5" />
                                                            <line
                                                                x1="150"
                                                                y1="75"
                                                                x2={refEndX}
                                                                y2={refEndY}
                                                                stroke={isTotalInternalReflection ? "#f43f5e" : "#e879f9"}
                                                                strokeWidth="2.5"
                                                            />
                                                            <text x="12" y="20" fill="#94a3b8" fontSize="9">n₁ = {n1}</text>
                                                            <text x="12" y="140" fill="#f5d0fe" fontSize="9">n₂ = {n2}</text>
                                                        </svg>
                                                    </div>

                                                    <div className="space-y-3 text-xs">
                                                        <div className="grid grid-cols-2 gap-2">
                                                            <div>
                                                                <label className="text-slate-200 block mb-1">Medio 1 (n₁):</label>
                                                                <select value={n1} onChange={e => setN1(e.target.value)} className="w-full bg-[#11141d] border border-[#323a50] rounded-lg p-1.5 text-slate-100">
                                                                    <option value="1.0">Aire (1.00)</option>
                                                                    <option value="1.33">Agua (1.33)</option>
                                                                    <option value="1.52">Vidrio (1.52)</option>
                                                                    <option value="2.42">Diamante (2.42)</option>
                                                                </select>
                                                            </div>
                                                            <div>
                                                                <label className="text-slate-200 block mb-1">Medio 2 (n₂):</label>
                                                                <select value={n2} onChange={e => setN2(e.target.value)} className="w-full bg-[#11141d] border border-[#323a50] rounded-lg p-1.5 text-slate-100">
                                                                    <option value="1.0">Aire (1.00)</option>
                                                                    <option value="1.33">Agua (1.33)</option>
                                                                    <option value="1.52">Vidrio (1.52)</option>
                                                                    <option value="2.42">Diamante (2.42)</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                        <div>
                                                            <label className="flex justify-between text-slate-200 mb-1">
                                                                <span>Ángulo de Incidencia (θ₁):</span>
                                                                <span className="font-mono text-fuchsia-300">{theta1}°</span>
                                                            </label>
                                                            <input type="range" min="0" max="89" step="1" value={theta1} onChange={e => setTheta1(e.target.value)} className="w-full accent-fuchsia-500 cursor-pointer" />
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="space-y-2.5 pt-2">
                                                    <div className="bg-[#11141d] border border-fuchsia-500/35 rounded-xl p-3 text-center">
                                                        <span className="text-[11px] text-slate-400 block">Ángulo Refractado (θ₂)</span>
                                                        <span className="text-sm font-extrabold text-fuchsia-400 font-mono">{theta2}</span>
                                                    </div>
                                                    <button
                                                        type="button"
                                                        onClick={() => sendTextToTutor(`Explica paso a paso esta refracción por Ley de Snell: n1 = ${n1}, n2 = ${n2}, ángulo de incidencia θ1 = ${theta1}° y resultado θ2 = ${theta2}.`)}
                                                        className="w-full py-2 px-3 rounded-xl bg-fuchsia-500/15 hover:bg-fuchsia-500/25 border border-fuchsia-500/30 text-fuchsia-300 text-xs font-semibold transition"
                                                    >
                                                        Explicar esta refracción con IA
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
