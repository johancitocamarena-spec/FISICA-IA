<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Física Master IA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090D16',
                        cardBg: '#111827',
                        accentBlue: '#38bdf8',
                        accentPurple: '#818cf8',
                        neonCyan: '#22d3ee',
                        neonPink: '#f472b6'
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- KaTeX for Mathematics -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <style>
        body {
            background-color: #090D16;
            color: #f3f4f6;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090D16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
        .glow-blue {
            box-shadow: 0 0 25px -5px rgba(56, 189, 248, 0.25);
        }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col">
    <div id="root" class="flex-1 flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const PHYSICS_TOPICS = [
            {
                id: "termodinamica",
                title: "Termodinámica",
                subtitle: "Leyes, Procesos Termodinámicos y Carnot",
                icon: "flame",
                accent: "from-amber-500 to-red-600",
                description: "Estudio de las transformaciones del calor en trabajo mecánico y viceversa. Analiza las leyes fundamentales, procesos termodinámicos y máquinas térmicas.",
                keyFormulas: [
                    "\\Delta U = Q - W",
                    "\\eta = 1 - \\frac{T_C}{T_H} \\quad (\\text{Carnot})",
                    "Q = mc\\Delta T"
                ],
                subtopics: [
                    "Primera y Segunda Ley de la Termodinámica",
                    "Procesos Isotérmicos, Adiabáticos, Isobáricos e Isocóricos",
                    "Máquinas Térmicas y Eficiencia de Carnot"
                ]
            },
            {
                id: "electromagnetismo",
                title: "Electromagnetismo",
                subtitle: "Campos Magnéticos, Ley de Ampère y Faraday",
                icon: "zap",
                accent: "from-cyan-500 to-blue-600",
                description: "Estudio de la interacción entre cargas eléctricas, corrientes y campos magnéticos.",
                keyFormulas: [
                    "\\vec{F} = q(\\vec{E} + \\vec{v} \\times \\vec{B})",
                    "\\varepsilon = -N \\frac{d\\Phi_B}{dt} \\quad (\\text{Faraday})",
                    "V = IR \\quad (\\text{Ohm})"
                ],
                subtopics: [
                    "Fuerza de Lorentz sobre Partículas Cargadas",
                    "Ley de Inducción de Faraday y Lenz",
                    "Circuitos y Leyes de Kirchhoff"
                ]
            },
            {
                id: "optica",
                title: "Luz y Óptica",
                subtitle: "Reflexión, Refracción, Ley de Snell y Lentes",
                icon: "sun",
                accent: "from-purple-500 to-indigo-600",
                description: "Propagación de la luz, leyes de la óptica geométrica y formación de imágenes.",
                keyFormulas: [
                    "n_1 \\sin(\\theta_1) = n_2 \\sin(\\theta_2) \\quad (\\text{Snell})",
                    "\\frac{1}{f} = \\frac{1}{d_o} + \\frac{1}{d_i}",
                    "m = -\\frac{d_i}{d_o}"
                ],
                subtopics: [
                    "Reflexión y Refracción de la Luz",
                    "Ley de Snell y Ángulo Crítico",
                    "Lentes Delgadas Convergentes y Divergentes"
                ]
            }
        ];

        // Función para llamar a Gemini API con prompt estricto en Física
        async function callGeminiAPI(messages, apiKey = "AQ.Ab8RN6JyXFXxjtqRu3VBkjyjkPT98pWfnJxwfcSPms16ioCj_w") {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            
            const systemInstruction = `Eres "Física Master IA", un profesor universitario experto EXCLUSIVAMENTE en Física, limitado estrictamente a los temas de Termodinámica, Electromagnetismo y Óptica (y física general relacionada).
REGLA ESTRICTA: Si el usuario te hace una pregunta, problema o consulta que NO pertenezca a la física (por ejemplo: programación, historia, matemáticas puras sin contexto físico, cultura general, etc.), debes negarte amablemente recordándole que estás programado exclusivamente para responder y resolver dudas de Física.
Cuando te pregunten sobre física o te suban imágenes de problemas, circuitos, diagramas termodinámicos u ópticos:
1. Explica los principios físicos aplicables.
2. Extrae los datos con claridad.
3. Plantea las ecuaciones paso a paso con rigor científico.
4. Resuelve numéricamente con unidades del SI.`;

            const contents = messages.map(m => {
                const parts = [];
                if (m.content) parts.push({ text: m.content });
                if (m.image) {
                    const commaIdx = m.image.indexOf(',');
                    const mimeType = m.image.substring(5, m.image.indexOf(';'));
                    const base64Data = m.image.substring(commaIdx + 1);
                    parts.push({
                        inline_data: {
                            mime_type: mimeType,
                            data: base64Data
                        }
                    });
                }
                return {
                    role: m.role === 'user' ? 'user' : 'model',
                    parts: parts
                };
            });

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: contents,
                        systemInstruction: { parts: [{ text: systemInstruction }] }
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || "Error al conectar con la API de Gemini.");
                }

                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "No se obtuvo respuesta de la IA.";
            } catch (err) {
                console.error("Gemini API Error:", err);
                throw err;
            }
        }

        function App() {
            const [activeTab, setActiveTab] = useState("chat"); // 'chat' or 'topics'
            const [sidebarOpen, setSidebarOpen] = useState(true);

            // API Key State
            const [apiKey, setApiKey] = useState(() => localStorage.getItem("fisica_master_api_key") || "");
            const [showApiKeyModal, setShowApiKeyModal] = useState(false);

            // Chats Persistentes en LocalStorage
            const [chats, setChats] = useState(() => {
                const saved = localStorage.getItem("fisica_master_chats");
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                    } catch(e) {}
                }
                return [
                    {
                        id: "chat_default",
                        title: "Sesión Inicial de Física",
                        messages: [
                            { role: 'model', content: "¡Hola! Soy **Física Master IA**, tu tutor especialista exclusivamente en **Termodinámica, Electromagnetismo y Óptica**. ¿Qué duda tienes hoy, qué ejercicio resolvemos o qué imagen de diagrama deseas que analice?" }
                        ]
                    }
                ];
            });
            const [currentChatId, setCurrentChatId] = useState(() => chats[0]?.id || "chat_default");

            // Chat Input State
            const [chatInput, setChatInput] = useState("");
            const [selectedImage, setSelectedImage] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);
            const fileInputRef = useRef(null);
            const chatEndRef = useRef(null);

            // Guardar chats en LocalStorage
            useEffect(() => {
                localStorage.setItem("fisica_master_chats", JSON.stringify(chats));
            }, [chats]);

            // Renderizar fórmulas KaTeX
            useEffect(() => {
                if (window.katex) {
                    document.querySelectorAll('.katex-render').forEach(el => {
                        try {
                            window.katex.render(el.getAttribute('data-formula') || '', el, {
                                throwOnError: false,
                                displayMode: el.classList.contains('display-mode')
                            });
                        } catch(e){}
                    });
                }
            }, [activeTab, chats, currentChatId]);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [chats, currentChatId, isGenerating]);

            const saveApiKey = (key) => {
                setApiKey(key);
                localStorage.setItem("fisica_master_api_key", key);
                setShowApiKeyModal(false);
            };

            const currentChat = chats.find(c => c.id === currentChatId) || chats[0];

            const createNewChat = () => {
                const newId = "chat_" + Date.now();
                const newChatObj = {
                    id: newId,
                    title: "Nueva Sesión de Física",
                    messages: [
                        { role: 'model', content: "¡Nuevo chat iniciado! Recuerda que estoy especializado exclusivamente en **Termodinámica, Electromagnetismo y Óptica**. ¿En qué te ayudo?" }
                    ]
                };
                setChats([newChatObj, ...chats]);
                setCurrentChatId(newId);
            };

            const deleteChat = (id, e) => {
                e.stopPropagation();
                if (chats.length <= 1) return;
                const filtered = chats.filter(c => c.id !== id);
                setChats(filtered);
                if (currentChatId === id) {
                    setCurrentChatId(filtered[0].id);
                }
            };

            const handleImageSelect = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setSelectedImage(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const removeSelectedImage = () => {
                setSelectedImage(null);
                if (fileInputRef.current) fileInputRef.current.value = "";
            };

            const handleSendMessage = async (textToSend = null) => {
                const text = textToSend !== null ? textToSend : chatInput;
                if ((!text.trim() && !selectedImage) || isGenerating) return;

                const userMsg = {
                    role: 'user',
                    content: text,
                    image: selectedImage
                };

                const updatedChats = chats.map(chat => {
                    if (chat.id === currentChatId) {
                        const newMsgs = [...chat.messages, userMsg];
                        let title = chat.title;
                        if (chat.messages.length <= 1 && text.trim()) {
                            title = text.slice(0, 28) + (text.length > 28 ? "..." : "");
                        }
                        return { ...chat, title, messages: newMsgs };
                    }
                    return chat;
                });

                setChats(updatedChats);
                if (textToSend === null) setChatInput("");
                const imgToSend = selectedImage;
                setSelectedImage(null);
                if (fileInputRef.current) fileInputRef.current.value = "";
                setIsGenerating(true);

                try {
                    const historyForAPI = currentChat.messages.concat([userMsg]);
                    const aiReply = await callGeminiAPI(historyForAPI, apiKey);

                    const aiMsg = { role: 'model', content: aiReply };
                    setChats(prev => prev.map(c => c.id === currentChatId ? { ...c, messages: [...c.messages, aiMsg] } : c));
                } catch (error) {
                    const errorMsg = { 
                        role: 'model', 
                        content: `⚠️ **Error de Conexión:** ${error.message}\n\nAsegúrate de configurar tu **Gemini API Key** haciendo clic en el botón superior derecho.` 
                    };
                    setChats(prev => prev.map(c => c.id === currentChatId ? { ...c, messages: [...c.messages, errorMsg] } : c));
                } finally {
                    setIsGenerating(false);
                }
            };

            return (
                <div className="flex h-screen overflow-hidden bg-darkBg text-gray-100">
                    {/* BARRA LATERAL (HISTORIAL DE CHATS & NAVEGACIÓN) */}
                    <aside className={`${sidebarOpen ? 'w-80' : 'w-0 lg:w-20'} bg-cardBg border-r border-gray-800 transition-all duration-300 flex flex-col z-20 overflow-hidden relative shadow-2xl shrink-0`}>
                        <div className="p-4 border-b border-gray-800 flex items-center justify-between">
                            <div className={`flex items-center space-x-3 ${!sidebarOpen && 'lg:hidden'}`}>
                                <div className="p-2.5 bg-gradient-to-br from-cyan-500 to-indigo-600 rounded-xl shadow-lg text-white">
                                    <i data-lucide="atom" className="w-5 h-5"></i>
                                </div>
                                <div>
                                    <h1 className="font-extrabold text-sm tracking-wide text-white uppercase">Física Master</h1>
                                    <span className="text-[10px] text-cyan-400 font-mono">Tutor IA Exclusivo</span>
                                </div>
                            </div>
                            <button 
                                onClick={() => setSidebarOpen(!sidebarOpen)}
                                className="p-2 hover:bg-gray-800 rounded-lg text-gray-400 hover:text-white transition-colors"
                            >
                                <i data-lucide={sidebarOpen ? "chevron-left" : "menu"} className="w-5 h-5"></i>
                            </button>
                        </div>

                        {sidebarOpen && (
                            <div className="p-3 border-b border-gray-800">
                                <button
                                    onClick={createNewChat}
                                    className="w-full py-2.5 px-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold rounded-xl text-xs flex items-center justify-center space-x-2 shadow-lg transition-all"
                                >
                                    <i data-lucide="plus" className="w-4 h-4"></i>
                                    <span>Nueva Conversación</span>
                                </button>
                            </div>
                        )}

                        {/* Lista de Chats Guardados en LocalStorage */}
                        <div className="flex-1 overflow-y-auto p-3 space-y-1.5">
                            {sidebarOpen && (
                                <div className="text-[11px] font-bold text-gray-500 uppercase tracking-wider px-2 py-1">
                                    Historial de Chats
                                </div>
                            )}

                            {chats.map(chat => {
                                const isSelected = chat.id === currentChatId;
                                return (
                                    <div
                                        key={chat.id}
                                        onClick={() => {
                                            setCurrentChatId(chat.id);
                                            setActiveTab("chat");
                                        }}
                                        className={`group flex items-center justify-between p-3 rounded-xl cursor-pointer transition-all ${
                                            isSelected
                                                ? 'bg-cyan-500/15 border border-cyan-500/40 text-cyan-300 font-medium'
                                                : 'hover:bg-gray-800/60 text-gray-400 hover:text-gray-200 border border-transparent'
                                        }`}
                                    >
                                        <div className="flex items-center space-x-2.5 min-w-0">
                                            <i data-lucide="message-square" className="w-4 h-4 shrink-0 text-cyan-400"></i>
                                            {sidebarOpen && <span className="truncate text-xs">{chat.title}</span>}
                                        </div>
                                        {sidebarOpen && chats.length > 1 && (
                                            <button
                                                onClick={(e) => deleteChat(chat.id, e)}
                                                className="opacity-0 group-hover:opacity-100 p-1 hover:text-red-400 text-gray-500 transition-opacity"
                                                title="Borrar chat"
                                            >
                                                <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                                            </button>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        {/* Footer Sidebar */}
                        {sidebarOpen && (
                            <div className="p-3 border-t border-gray-800 bg-gray-950/60 flex items-center justify-between text-xs text-gray-400">
                                <span className="flex items-center">
                                    <span className={`w-2 h-2 rounded-full mr-2 ${apiKey ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
                                    {apiKey ? 'IA Conectada' : 'Falta API Key'}
                                </span>
                                <button
                                    onClick={() => setShowApiKeyModal(true)}
                                    className="text-cyan-400 hover:underline text-[11px]"
                                >
                                    API Key
                                </button>
                            </div>
                        )}
                    </aside>

                    {/* CONTENIDO PRINCIPAL */}
                    <main className="flex-1 flex flex-col overflow-hidden bg-darkBg">
                        {/* NAVBAR SUPERIOR */}
                        <header className="h-16 border-b border-gray-800 bg-cardBg/80 backdrop-blur-md px-6 flex items-center justify-between shrink-0 shadow-lg">
                            <div className="flex items-center space-x-3">
                                <div className="flex space-x-1.5 bg-gray-900/90 p-1 rounded-xl border border-gray-800">
                                    <button
                                        onClick={() => setActiveTab('chat')}
                                        className={`px-4 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-2 ${
                                            activeTab === 'chat' 
                                                ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-md' 
                                                : 'text-gray-400 hover:text-gray-200'
                                        }`}
                                    >
                                        <i data-lucide="bot" className="w-3.5 h-3.5"></i>
                                        <span>Tutor IA Física</span>
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('topics')}
                                        className={`px-4 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-2 ${
                                            activeTab === 'topics' 
                                                ? 'bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-md' 
                                                : 'text-gray-400 hover:text-gray-200'
                                        }`}
                                    >
                                        <i data-lucide="book-open" className="w-3.5 h-3.5"></i>
                                        <span>Temas & Fórmulas</span>
                                    </button>
                                </div>
                            </div>

                            <button
                                onClick={() => setShowApiKeyModal(true)}
                                className="px-3.5 py-1.5 rounded-xl border border-gray-700 hover:border-cyan-500/50 text-xs text-gray-300 flex items-center space-x-2 bg-gray-900/60 transition-colors"
                            >
                                <i data-lucide="key" className="w-3.5 h-3.5 text-amber-400"></i>
                                <span>{apiKey ? 'API Key Configurada' : 'Configurar API Key'}</span>
                            </button>
                        </header>

                        {/* CUERPO SEGÚN PESTAÑA */}
                        <div className="flex-1 overflow-hidden flex flex-col">
                            {activeTab === 'chat' ? (
                                <div className="flex-1 flex flex-col h-full max-w-4xl mx-w-4xl mx-auto w-full p-4 md:p-6 overflow-hidden">
                                    {/* Cabecera del chat */}
                                    <div className="bg-cardBg px-5 py-3 rounded-2xl border border-gray-800 mb-4 flex items-center justify-between shrink-0 shadow">
                                        <div className="flex items-center space-x-3">
                                            <div className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></div>
                                            <span className="text-xs font-bold text-gray-200">Asistente Exclusivo de Física (Termodinámica, Electromagnetismo y Óptica)</span>
                                        </div>
                                        <span className="text-[10px] bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 px-2 py-0.5 rounded-full">Modo Estricto Física</span>
                                    </div>

                                    {/* Historial de Mensajes */}
                                    <div className="flex-1 overflow-y-auto space-y-4 pr-2">
                                        {currentChat.messages.map((msg, index) => (
                                            <div key={index} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                <div className={`max-w-[85%] rounded-3xl p-4 text-sm leading-relaxed ${
                                                    msg.role === 'user'
                                                        ? 'bg-gradient-to-r from-cyan-600 to-blue-600 text-white rounded-br-none shadow-lg'
                                                        : 'bg-cardBg border border-gray-800 text-gray-200 rounded-bl-none shadow-xl'
                                                }`}>
                                                    {msg.image && (
                                                        <div className="mb-3">
                                                            <img src={msg.image} alt="Adjunto" className="max-h-56 rounded-xl object-contain border border-gray-700 shadow" />
                                                        </div>
                                                    )}
                                                    <div className="whitespace-pre-line">
                                                        {msg.content}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                        {isGenerating && (
                                            <div className="flex justify-start">
                                                <div className="bg-cardBg border border-gray-800 p-4 rounded-3xl rounded-bl-none text-gray-400 text-xs flex items-center space-x-3 shadow-lg">
                                                    <div className="w-2.5 h-2.5 bg-cyan-400 rounded-full animate-ping"></div>
                                                    <span>El profesor IA está analizando los principios físicos...</span>
                                                </div>
                                            </div>
                                        )}
                                        <div ref={chatEndRef} />
                                    </div>

                                    {/* Barra de Entrada de Chat y Subida de Imágenes */}
                                    <div className="mt-4 shrink-0 bg-cardBg border border-gray-800 rounded-3xl p-3 shadow-2xl space-y-3">
                                        {selectedImage && (
                                            <div className="flex items-center justify-between bg-darkBg p-2.5 rounded-2xl border border-gray-700">
                                                <div className="flex items-center space-x-3">
                                                    <img src={selectedImage} alt="Preview" className="w-12 h-12 rounded-xl object-cover border border-gray-600" />
                                                    <span className="text-xs text-gray-300 font-medium">Imagen cargada lista para analizar</span>
                                                </div>
                                                <button
                                                    onClick={removeSelectedImage}
                                                    className="p-1.5 hover:bg-gray-800 rounded-lg text-gray-400 hover:text-red-400 transition-colors"
                                                >
                                                    <i data-lucide="x" className="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        )}

                                        <div className="flex items-center space-x-2">
                                            {/* Botón Visible de Carga de Imágenes */}
                                            <input 
                                                type="file" 
                                                accept="image/*" 
                                                ref={fileInputRef} 
                                                onChange={handleImageSelect} 
                                                className="hidden" 
                                            />
                                            <button
                                                type="button"
                                                onClick={() => fileInputRef.current?.click()}
                                                className="p-3 bg-gray-800 hover:bg-gray-700 text-cyan-400 rounded-2xl transition-colors flex items-center justify-center shrink-0 border border-gray-700 shadow"
                                                title="Subir imagen de problema, circuito o diagrama"
                                            >
                                                <i data-lucide="image" className="w-5 h-5"></i>
                                            </button>

                                            <input
                                                type="text"
                                                placeholder="Pregunta sobre Termodinámica, Electromagnetismo, Óptica o sube tu ejercicio..."
                                                value={chatInput}
                                                onChange={(e) => setChatInput(e.target.value)}
                                                onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                                                className="flex-1 bg-darkBg border border-gray-700 rounded-2xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 shadow-inner"
                                            />

                                            <button
                                                onClick={() => handleSendMessage()}
                                                disabled={isGenerating || (!chatInput.trim() && !selectedImage)}
                                                className="px-5 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 disabled:opacity-50 text-white rounded-2xl font-semibold transition-all flex items-center justify-center shadow-lg shrink-0"
                                            >
                                                <i data-lucide="send" className="w-4 h-4"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex-1 overflow-y-auto p-4 md:p-8 max-w-5xl mx-auto space-y-8">
                                    <div>
                                        <h2 className="text-2xl md:text-3xl font-extrabold text-white">Temas y Fórmulas Fundamentales</h2>
                                        <p className="text-xs text-gray-400 mt-1">Bloques académicos exclusivos cubiertos por Física Master IA.</p>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        {PHYSICS_TOPICS.map(topic => (
                                            <div key={topic.id} className="bg-cardBg p-6 rounded-3xl border border-gray-800 shadow-xl space-y-4 flex flex-col justify-between">
                                                <div className="space-y-3">
                                                    <div className={`w-10 h-10 rounded-2xl bg-gradient-to-br ${topic.accent} text-white flex items-center justify-center shadow`}>
                                                        <i data-lucide={topic.icon} className="w-5 h-5"></i>
                                                    </div>
                                                    <h3 className="text-lg font-bold text-white">{topic.title}</h3>
                                                    <p className="text-xs text-gray-400 leading-relaxed">{topic.description}</p>
                                                    <ul className="space-y-1.5 pt-2">
                                                        {topic.subtopics.map((sub, i) => (
                                                            <li key={i} className="text-xs text-gray-300 flex items-center">
                                                                <span className="w-1.5 h-1.5 rounded-full bg-cyan-400 mr-2"></span>
                                                                {sub}
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>

                                                <div className="space-y-2 pt-4 border-t border-gray-800">
                                                    <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Fórmulas Clave</span>
                                                    {topic.keyFormulas.map((form, i) => (
                                                        <div key={i} className="bg-darkBg p-2.5 rounded-xl border border-gray-800 text-center text-cyan-300 font-mono text-xs overflow-x-auto">
                                                            <span className="katex-render display-mode" data-formula={form}></span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* MODAL CONFIGURACIÓN API KEY */}
                    {showApiKeyModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-cardBg border border-gray-800 rounded-3xl max-w-md w-full p-6 md:p-8 shadow-2xl relative space-y-4">
                                <div className="flex items-center space-x-3">
                                    <div className="p-3 bg-amber-500/10 text-amber-400 rounded-2xl border border-amber-500/20">
                                        <i data-lucide="key" className="w-6 h-6"></i>
                                    </div>
                                    <div>
                                        <h3 className="text-lg font-bold text-white">Configurar Gemini API Key</h3>
                                        <p className="text-xs text-gray-400">Ingresa tu clave para habilitar las respuestas del tutor IA.</p>
                                    </div>
                                </div>
                                <input
                                    type="password"
                                    placeholder="AIzaSy..."
                                    defaultValue={apiKey}
                                    id="apiKeyInputModal"
                                    className="w-full bg-darkBg border border-gray-700 rounded-2xl p-3.5 text-sm text-white focus:outline-none focus:border-cyan-500 font-mono shadow-inner"
                                />
                                <div className="flex justify-end space-x-3 pt-2">
                                    <button
                                        onClick={() => setShowApiKeyModal(false)}
                                        className="px-4 py-2.5 rounded-xl text-xs text-gray-400 hover:bg-gray-800 transition-colors"
                                    >
                                        Cancelar
                                    </button>
                                    <button
                                        onClick={() => {
                                            const val = document.getElementById("apiKeyInputModal").value;
                                            saveApiKey(val);
                                        }}
                                        className="px-5 py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white text-xs font-semibold rounded-xl shadow-lg transition-all"
                                    >
                                        Guardar Clave
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        setTimeout(() => {
            if (window.lucide) window.lucide.createIcons();
        }, 300);
    </script>
</body>
</html>
